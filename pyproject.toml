[project]
name = "legacy-bridge"
version = "0.1.0"
description = "Expose a legacy tool to AI agents via L0-L3 backends, capability discovery, MCP 2026-07-28 and a JSON CLI"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ming-Chih Lung" }]
dependencies = [
  "mcp[cli]>=2.2,<3",
  "pyyaml>=6",
]

[project.optional-dependencies]
windows = [
  "pywinauto>=0.6.8",   # L2 UIA
  "pywin32>=306",       # L1 COM
  "mss>=9",             # L3 screenshot
  "pyautogui>=0.9.54",  # L3 input
  "opencv-python>=4.9", # L3 template match / SoM candidates
  "pillow>=10",
  "rapidocr-onnxruntime>=1.3",  # L3 OCR (optional)
]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
lb = "legacy_bridge.cli:main"
lb-mcp = "legacy_bridge.mcp_server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
